modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
# Client-only: servers do not need it and clients may join servers without it
clientSideOnly = true

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''${description}'''
logoFile = "assets/spotifywidget/icon.png"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
