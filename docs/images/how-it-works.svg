<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5C5E68"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1DB954"/>
    </marker>
  </defs>

  <rect width="1280" height="600" rx="24" fill="#0E0F14"/>
  <text x="48" y="64" fill="#FFFFFF" font-size="32" font-weight="700">How it works</text>
  <text x="48" y="96" fill="#8C8C8C" font-size="18">The OS already knows what Spotify is playing. The mod just asks it — no Spotify Web API involved.</text>

  <!-- column labels -->
  <g font-size="13" font-weight="700" fill="#5C5E68" letter-spacing="2">
    <text x="48" y="146">DESKTOP APP</text>
    <text x="300" y="146">OS MEDIA SESSION</text>
    <text x="580" y="146">HELPER (POLLED)</text>
    <text x="890" y="146">IN GAME</text>
  </g>

  <!-- Spotify -->
  <rect x="48" y="200" width="210" height="150" rx="14" fill="#1DB954" fill-opacity="0.12" stroke="#1DB954" stroke-width="2"/>
  <circle cx="153" cy="248" r="24" fill="#1DB954"/>
  <path d="M140 242q13-5 27 1M142 250q11-4 22 1M144 257q9-3 17 1" stroke="#0E0F14" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="153" y="300" fill="#FFFFFF" font-size="20" font-weight="600" text-anchor="middle">Spotify</text>
  <text x="153" y="324" fill="#9FD9B3" font-size="14" text-anchor="middle">desktop client</text>

  <!-- Windows path -->
  <rect x="300" y="168" width="240" height="96" rx="14" fill="#1A1C24" stroke="#33343A" stroke-width="2"/>
  <text x="320" y="200" fill="#FFFFFF" font-size="18" font-weight="600">Windows · SMTC</text>
  <text x="320" y="226" fill="#B3B3B3" font-size="14">media session behind the</text>
  <text x="320" y="246" fill="#B3B3B3" font-size="14">volume flyout</text>

  <rect x="580" y="168" width="270" height="96" rx="14" fill="#1A1C24" stroke="#33343A" stroke-width="2"/>
  <text x="600" y="200" fill="#FFFFFF" font-size="18" font-weight="600">nowplaying.ps1</text>
  <text x="600" y="226" fill="#B3B3B3" font-size="14">powershell -EncodedCommand</text>
  <text x="600" y="246" fill="#B3B3B3" font-size="14">one JSON line per poll</text>

  <!-- Linux path -->
  <rect x="300" y="286" width="240" height="96" rx="14" fill="#1A1C24" stroke="#33343A" stroke-width="2"/>
  <text x="320" y="318" fill="#FFFFFF" font-size="18" font-weight="600">Linux · MPRIS</text>
  <text x="320" y="344" fill="#B3B3B3" font-size="14">D-Bus player</text>
  <text x="320" y="364" fill="#B3B3B3" font-size="13" font-family="Consolas, Menlo, monospace">org.mpris…spotify</text>

  <rect x="580" y="286" width="270" height="96" rx="14" fill="#1A1C24" stroke="#33343A" stroke-width="2"/>
  <text x="600" y="318" fill="#FFFFFF" font-size="18" font-weight="600">gdbus / playerctl</text>
  <text x="600" y="344" fill="#B3B3B3" font-size="14">gdbus first,</text>
  <text x="600" y="364" fill="#B3B3B3" font-size="14">playerctl as fallback</text>

  <!-- Mod -->
  <rect x="890" y="200" width="342" height="150" rx="14" fill="#1A1C24" stroke="#1DB954" stroke-width="2"/>
  <text x="912" y="234" fill="#FFFFFF" font-size="20" font-weight="600">Spoty Widget</text>
  <g fill="#B3B3B3" font-size="14">
    <text x="912" y="264">• interpolates position between polls</text>
    <text x="912" y="288">• uploads cover texture on client tick</text>
    <text x="912" y="312">• draws one of 5 HUD designs</text>
    <text x="912" y="336">• never talks to the game server</text>
  </g>

  <!-- arrows -->
  <g stroke="#5C5E68" stroke-width="2.5" fill="none">
    <path d="M258 250C280 250 280 216 298 216" marker-end="url(#arrow)"/>
    <path d="M258 300C280 300 280 334 298 334" marker-end="url(#arrow)"/>
    <path d="M540 216H578" marker-end="url(#arrow)"/>
    <path d="M540 334H578" marker-end="url(#arrow)"/>
    <path d="M850 216C870 216 870 250 888 250" marker-end="url(#arrow)"/>
    <path d="M850 334C870 334 870 300 888 300" marker-end="url(#arrow)"/>
  </g>

  <!-- cover art lookup -->
  <rect x="580" y="420" width="270" height="96" rx="14" fill="#1A1C24" stroke="#33343A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="600" y="452" fill="#FFFFFF" font-size="18" font-weight="600">Album art lookup</text>
  <text x="600" y="478" fill="#B3B3B3" font-size="14">Windows: Deezer, then iTunes</text>
  <text x="600" y="498" fill="#B3B3B3" font-size="14">Linux: MPRIS cover URL</text>
  <path d="M850 468C890 468 1000 420 1000 352" stroke="#1DB954" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowG)"/>
  <text x="922" y="490" fill="#7BE3A0" font-size="14">artist + title, no key</text>

  <!-- controls back -->
  <path d="M1160 352V548H153V352" stroke="#5C5E68" stroke-width="2" fill="none" stroke-dasharray="3 6" marker-end="url(#arrow)"/>
  <text x="300" y="576" fill="#8C8C8C" font-size="14">← media keys: next / prev / play-pause / volume</text>
</svg>
