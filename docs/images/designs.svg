<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="696" viewBox="0 0 1280 696" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8FD6"/>
      <stop offset="0.62" stop-color="#9CC3EE"/>
      <stop offset="0.62" stop-color="#5E9E3A"/>
      <stop offset="0.66" stop-color="#4C8A2E"/>
      <stop offset="0.66" stop-color="#7A5536"/>
      <stop offset="1" stop-color="#5E3F27"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DB954"/>
      <stop offset="0.55" stop-color="#1E6F5C"/>
      <stop offset="1" stop-color="#29294A"/>
    </linearGradient>
    <linearGradient id="vborder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5000FF" stop-opacity="0.31"/>
      <stop offset="1" stop-color="#28007F" stop-opacity="0.31"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="696" rx="24" fill="#0E0F14"/>
  <text x="48" y="64" fill="#FFFFFF" font-size="32" font-weight="700">Five designs, one button</text>
  <text x="48" y="96" fill="#8C8C8C" font-size="18">Illustration · colours taken from WidgetRenderer · cycle in the settings screen</text>

  <!-- 1 Classic -->
  <g transform="translate(48 132)">
    <rect width="380" height="200" rx="16" fill="url(#bg)"/>
    <rect width="380" height="200" rx="16" fill="#000" fill-opacity="0.15"/>
    <g transform="translate(16 16)">
      <rect width="270" height="84" rx="8" fill="#14141A" fill-opacity="0.88" stroke="#33343A" stroke-width="1.5"/>
      <rect x="8" y="8" width="68" height="68" rx="7" fill="url(#art)"/>
      <g font-family="Consolas, Menlo, monospace" font-size="15">
        <text x="88" y="28" fill="#FFFFFF">Blinding Lights</text>
        <text x="88" y="49" fill="#B3B3B3">The Weeknd</text>
        <text x="88" y="70" fill="#8C8C8C">01:24 / 03:20</text>
      </g>
      <g fill="#DCDCDC"><rect x="230" y="34" width="4" height="16"/><rect x="237" y="27" width="4" height="30"/><rect x="244" y="37" width="4" height="10"/><rect x="251" y="30" width="4" height="24"/></g>
    </g>
    <text x="0" y="232" fill="#FFFFFF" font-size="20" font-weight="600">Classic</text>
    <text x="0" y="256" fill="#8C8C8C" font-size="15">32px art, three lines, equaliser</text>
  </g>

  <!-- 2 Progress bar -->
  <g transform="translate(450 132)">
    <rect width="380" height="200" rx="16" fill="url(#bg)"/>
    <rect width="380" height="200" rx="16" fill="#000" fill-opacity="0.15"/>
    <g transform="translate(16 16)">
      <rect width="348" height="84" rx="8" fill="#14141A" fill-opacity="0.88" stroke="#33343A" stroke-width="1.5"/>
      <rect x="8" y="8" width="68" height="68" rx="7" fill="url(#art)"/>
      <g font-family="Consolas, Menlo, monospace" font-size="15">
        <text x="88" y="30" fill="#FFFFFF">Blinding Lights</text>
        <text x="88" y="52" fill="#B3B3B3">The Weeknd</text>
        <text x="300" y="52" fill="#8C8C8C" text-anchor="end">1:24 / 3:20</text>
      </g>
      <g fill="#DCDCDC"><rect x="310" y="34" width="4" height="12"/><rect x="317" y="28" width="4" height="24"/><rect x="324" y="36" width="4" height="8"/><rect x="331" y="31" width="4" height="18"/></g>
      <rect x="88" y="64" width="252" height="8" rx="4" fill="#3A3A44"/>
      <rect x="88" y="64" width="106" height="8" rx="4" fill="#1DB954"/>
    </g>
    <text x="0" y="232" fill="#FFFFFF" font-size="20" font-weight="600">Progress bar</text>
    <text x="0" y="256" fill="#8C8C8C" font-size="15">Rounded green bar across the panel</text>
  </g>

  <!-- 3 Compact -->
  <g transform="translate(852 132)">
    <rect width="380" height="200" rx="16" fill="url(#bg)"/>
    <rect width="380" height="200" rx="16" fill="#000" fill-opacity="0.15"/>
    <g transform="translate(16 16)">
      <rect width="320" height="44" rx="6" fill="#14141A" fill-opacity="0.88" stroke="#33343A" stroke-width="1.5"/>
      <rect x="6" y="6" width="30" height="30" rx="4" fill="url(#art)"/>
      <g font-family="Consolas, Menlo, monospace" font-size="15">
        <text x="46" y="26" fill="#FFFFFF">Blinding Lights</text>
        <text x="186" y="26" fill="#63636F">·</text>
        <text x="200" y="26" fill="#B3B3B3">Weeknd</text>
        <text x="312" y="26" fill="#8C8C8C" text-anchor="end">-1:56</text>
      </g>
      <rect x="6" y="36" width="308" height="3" fill="#3A3A44"/>
      <rect x="6" y="36" width="130" height="3" fill="#1DB954"/>
    </g>
    <text x="0" y="232" fill="#FFFFFF" font-size="20" font-weight="600">Compact</text>
    <text x="0" y="256" fill="#8C8C8C" font-size="15">One slim 22px row, time remaining</text>
  </g>

  <!-- 4 Above hotbar -->
  <g transform="translate(249 412)">
    <rect width="380" height="200" rx="16" fill="url(#bg)"/>
    <rect width="380" height="200" rx="16" fill="#000" fill-opacity="0.15"/>
    <g font-family="Consolas, Menlo, monospace" font-size="14">
      <g fill="#DCDCDC"><rect x="30" y="104" width="3" height="10"/><rect x="36" y="99" width="3" height="20"/><rect x="42" y="106" width="3" height="6"/><rect x="48" y="101" width="3" height="16"/></g>
      <text x="60" y="115" fill="#FFFFFF">Blinding Lights</text>
      <text x="192" y="115" fill="#8A8A96">·</text>
      <text x="204" y="115" fill="#B3B3B3">Weeknd</text>
      <text x="354" y="115" fill="#8C8C8C" text-anchor="end">1:24/3:20</text>
      <text x="190" y="138" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">Diamond Sword</text>
    </g>
    <rect x="100" y="150" width="180" height="4" fill="#1B1B1B"/>
    <rect x="100" y="150" width="120" height="4" fill="#80FF20"/>
    <g fill="#8B8B8B" fill-opacity="0.75" stroke="#2B2B2B" stroke-width="2">
      <rect x="100" y="160" width="20" height="20"/><rect x="120" y="160" width="20" height="20"/><rect x="140" y="160" width="20" height="20"/><rect x="160" y="160" width="20" height="20"/><rect x="180" y="160" width="20" height="20"/><rect x="200" y="160" width="20" height="20"/><rect x="220" y="160" width="20" height="20"/><rect x="240" y="160" width="20" height="20"/><rect x="260" y="160" width="20" height="20"/>
    </g>
    <rect x="98" y="158" width="24" height="24" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="232" fill="#FFFFFF" font-size="20" font-weight="600">Above hotbar</text>
    <text x="0" y="256" fill="#8C8C8C" font-size="15">No panel, one line above the held item name</text>
  </g>

  <!-- 5 Vanilla tooltip -->
  <g transform="translate(651 412)">
    <rect width="380" height="200" rx="16" fill="url(#bg)"/>
    <rect width="380" height="200" rx="16" fill="#000" fill-opacity="0.15"/>
    <g transform="translate(20 20)">
      <rect width="250" height="76" fill="#100010" fill-opacity="0.94"/>
      <rect x="3" y="3" width="244" height="70" fill="none" stroke="url(#vborder)" stroke-width="3"/>
      <rect x="10" y="10" width="32" height="32" fill="url(#art)"/>
      <g font-family="Consolas, Menlo, monospace" font-size="15">
        <text x="52" y="24" fill="#FFFFFF">Blinding Lights</text>
        <text x="52" y="44" fill="#AAAAAA">The Weeknd</text>
        <text x="52" y="64" fill="#555555">01:24 / 03:20</text>
      </g>
      <g fill="#DCDCDC"><rect x="216" y="32" width="4" height="12"/><rect x="223" y="26" width="4" height="24"/><rect x="230" y="34" width="4" height="8"/><rect x="237" y="29" width="4" height="18"/></g>
    </g>
    <text x="0" y="232" fill="#FFFFFF" font-size="20" font-weight="600">Vanilla tooltip</text>
    <text x="0" y="256" fill="#8C8C8C" font-size="15">Item-tooltip box, art where the icon sits</text>
  </g>
</svg>
