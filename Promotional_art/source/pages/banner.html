<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
    body { height: 560px; overflow: hidden; }
    .shot { position: absolute; inset: 0; overflow: hidden; }
    .shot img { position: absolute; width: 1120px; right: 0; top: -100px; }
    .shade { position: absolute; inset: 0;
        background: linear-gradient(90deg, rgba(17,19,24,1) 0%, rgba(17,19,24,1) 34%, rgba(17,19,24,.84) 50%, rgba(17,19,24,.5) 70%, rgba(17,19,24,.4) 100%),
                    linear-gradient(0deg, rgba(17,19,24,.55), rgba(17,19,24,0) 40%); }

    .text { position: absolute; left: 90px; top: 84px; display: flex; flex-direction: column; align-items: flex-start; }
    .eyebrow { margin-bottom: 26px; }
    h1 { display: inline-block; font: 800 82px/92px 'Inter'; letter-spacing: -2.4px; }
    .sub { width: 740px; margin-top: 22px; font: 400 32px/44px 'Inter'; color: #e3e5ea; }
    .sub b { font-weight: 700; color: #fff; }

    .chips { display: flex; gap: 12px; margin-top: 40px; }
    .chip { position: relative; display: flex; align-items: center; height: 51px; padding: 0 20px 0 19px; }
    .chip .bg { position: absolute; inset: 0; border-radius: 26px; background: rgba(32,35,43,.88); border: 1.5px solid rgba(255,255,255,.12); }
    .chip .dot { position: relative; width: 12px; height: 12px; border-radius: 6px; margin-right: 11px; }
    .chip span { position: relative; font: 700 21px/24px 'Inter'; }
    .chip.ver span { font: 400 20px/24px 'DejaVu Sans Mono'; letter-spacing: 1px; }

    .widget { position: absolute; box-shadow: 0 18px 40px rgba(0,0,0,.6); }
    .widget .crop { width: 100%; height: 100%; border-radius: inherit; }
</style></head>
<body>
<div class="page-bg" data-layer="Background"></div>
<div class="shot" data-layer="Screenshot (19.56.22)"><img src="../../original/2026-11-04_19.56.22.png"></div>
<div class="shade" data-layer="Dark gradient"></div>

<div class="text" data-group="Title block">
    <div class="eyebrow" data-layer="MINECRAFT NOW PLAYING MOD" data-text>MINECRAFT NOW PLAYING MOD</div>
    <h1 data-layer="Spoty Widget" data-text>Spoty Widget</h1>
    <div class="sub" data-layer="Subtitle" data-text>See <b>what's playing</b> without leaving the game - album art, song and time, right on your HUD.</div>
    <div class="chips" data-group="Loader chips">
        <div class="chip" data-group="Chip - Fabric"><div class="bg" data-layer="Chip"></div><div class="dot" style="background:var(--fabric)" data-layer="Dot"></div><span data-layer="Fabric" data-text>Fabric</span></div>
        <div class="chip" data-group="Chip - Quilt"><div class="bg" data-layer="Chip"></div><div class="dot" style="background:var(--quilt)" data-layer="Dot"></div><span data-layer="Quilt" data-text>Quilt</span></div>
        <div class="chip" data-group="Chip - NeoForge"><div class="bg" data-layer="Chip"></div><div class="dot" style="background:var(--neoforge)" data-layer="Dot"></div><span data-layer="NeoForge" data-text>NeoForge</span></div>
        <div class="chip" data-group="Chip - Forge"><div class="bg" data-layer="Chip"></div><div class="dot" style="background:var(--forge)" data-layer="Dot"></div><span data-layer="Forge" data-text>Forge</span></div>
        <div class="chip ver" data-group="Chip - versions"><div class="bg" data-layer="Chip"></div><span data-layer="1.21 → 26.3" data-text>1.21 → 26.3</span></div>
    </div>
</div>

<div data-group="Widgets">
    <div class="widget" style="left:1050px; top:52px; width:460px; height:300px; border-radius:42px; transform:rotate(3deg)" data-layer="Card large (20.05.33)">
        <div class="crop" style="--x:36;--y:36;--s:0.581"><img src="../../original/2026-11-04_20.05.33.png"></div></div>
    <div class="widget" style="left:986px; top:388px; width:540px; height:58px; border-radius:18px; transform:rotate(-1.5deg)" data-layer="Compact (20.00.10)">
        <div class="crop" style="--x:1182;--y:18;--s:0.75"><img src="../../original/2026-11-04_20.00.10.png"></div></div>
    <div class="widget" style="left:1090px; top:470px; width:444px; height:38px; border-radius:19px; transform:rotate(1deg)" data-layer="Card thin (20.03.24)">
        <div class="crop" style="--x:18;--y:18;--s:0.65"><img src="../../original/2026-11-04_20.03.24.png"></div></div>
</div>
</body></html>
