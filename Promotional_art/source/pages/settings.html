<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
    .stage { position: relative; height: 600px; }
    .shot { position: absolute; left: 0; top: 0; width: 960px; height: 600px; border-radius: 18px; border: 1.5px solid var(--edge); overflow: hidden; }
    .shot .crop { width: 100%; height: 100%; }
    .pin { position: absolute; width: 44px; height: 44px; }
    .pin .disc { position: absolute; inset: 0; border-radius: 22px; background: var(--yellow); box-shadow: 0 4px 12px rgba(0,0,0,.6); }
    .pin b { position: absolute; left: 0; top: 7px; width: 44px; text-align: center; font: 800 24px/30px 'Inter'; color: #111318; }
    .list { position: absolute; left: 1010px; top: 0; width: 446px; display: flex; flex-direction: column; gap: 22px; }
    .row { position: relative; display: flex; gap: 18px; height: 134px; align-items: flex-start; }
    .row .num { position: relative; flex: none; width: 44px; height: 44px; margin-top: 2px; }
    .row .num .disc { position: absolute; inset: 0; border-radius: 22px; background: var(--yellow); }
    .row .num b { position: absolute; left: 0; top: 7px; width: 44px; text-align: center; font: 800 24px/30px 'Inter'; color: #111318; }
    .words { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .words b { display: inline-block; font: 800 28px/34px 'Inter'; letter-spacing: -0.3px; }
    .words span { display: inline-block; width: 384px; font: 400 21px/29px 'Inter'; color: var(--sub); }
</style></head>
<body>
<div class="page-bg" data-layer="Background"></div>
<div class="wrap">
    <div class="head" data-group="Heading">
        <div class="eyebrow" data-layer="SETTINGS" data-text>SETTINGS</div>
        <div class="title" data-layer="See every change as you make it" data-text>See every change as you make it</div>
    </div>
    <div class="stage">
        <div class="shot" data-layer="Settings screen (20.06.07)"><div class="crop" style="--x:0;--y:0;--s:0.5"><img src="../../original/2026-11-04_20.06.07.png"></div></div>
        <div data-group="Pins">
            <div class="pin" style="left:118px; top:188px" data-group="Pin 1"><div class="disc" data-layer="Disc"></div><b data-layer="1" data-text>1</b></div>
            <div class="pin" style="left:82px; top:500px" data-group="Pin 2"><div class="disc" data-layer="Disc"></div><b data-layer="2" data-text>2</b></div>
            <div class="pin" style="left:930px; top:30px" data-group="Pin 3"><div class="disc" data-layer="Disc"></div><b data-layer="3" data-text>3</b></div>
            <div class="pin" style="left:930px; top:276px" data-group="Pin 4"><div class="disc" data-layer="Disc"></div><b data-layer="4" data-text>4</b></div>
        </div>
        <div class="list">
            <div class="row" data-group="Live preview"><div class="num"><div class="disc" data-layer="Disc"></div><b data-layer="1" data-text>1</b></div><div class="words"><b data-layer="Live preview" data-text>Live preview</b><span data-layer="Live preview note" data-text>Your real song, over your real world</span></div></div>
            <div class="row" data-group="Move on screen"><div class="num"><div class="disc" data-layer="Disc"></div><b data-layer="2" data-text>2</b></div><div class="words"><b data-layer="Move on screen" data-text>Move on screen</b><span data-layer="Move note" data-text>Drag it into place, it snaps to the guides</span></div></div>
            <div class="row" data-group="Search"><div class="num"><div class="disc" data-layer="Disc"></div><b data-layer="3" data-text>3</b></div><div class="words"><b data-layer="Search" data-text>Search</b><span data-layer="Search note" data-text>Find any setting by typing its name</span></div></div>
            <div class="row" data-group="Design buttons"><div class="num"><div class="disc" data-layer="Disc"></div><b data-layer="4" data-text>4</b></div><div class="words"><b data-layer="One click designs" data-text>One click designs</b><span data-layer="Design note" data-text>Switch design and see it straight away</span></div></div>
        </div>
    </div>
</div>
</body></html>
